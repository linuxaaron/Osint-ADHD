name: Sync OSINT Framework

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync upstream dataset
        run: python3 scripts/sync_upstream.py

      - name: Validate generated data
        run: |
          python3 -m json.tool data/osint-framework.json >/dev/null
          test -s data/osint-framework-links.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osint-framework.json data/osint-framework-links.md
          if git diff --cached --quiet; then
            echo "No upstream changes."
            exit 0
          fi
          git commit -m "chore: sync OSINT Framework data"
          git push
